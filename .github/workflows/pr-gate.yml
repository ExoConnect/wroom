name: pr-gate

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  trusted-only:
    runs-on: ubuntu-latest
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
      github.event.pull_request.author_association)
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: "Thanks for the interest! wroom isn't accepting unsolicited PRs yet — pull requests are limited to project collaborators. If you'd like to contribute, open an issue describing the change first. See CONTRIBUTING.md.",
            });
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: number,
              state: "closed",
            });
