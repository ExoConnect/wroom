name: pr-gate

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  trusted-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const user = pr.user.login;
            const number = pr.number;

            // Trusted = same-repo branch (only collaborators can push one)
            // or a live collaborator-permission check. The event payload's
            // author_association is unreliable under pull_request_target
            // (it closed the owner's own PRs), so we ask the API instead
            // of reading the payload.
            const sameRepo = pr.head.repo.full_name === `${owner}/${repo}`;
            let trusted = sameRepo;
            if (!trusted) {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner, repo, username: user,
                });
                trusted = ["admin", "maintain", "write"].includes(data.permission);
              } catch {
                trusted = false;
              }
            }
            core.info(`pr #${number} by ${user}: sameRepo=${sameRepo} trusted=${trusted}`);
            if (trusted) return;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: "Thanks for the interest! wroom isn't accepting unsolicited PRs yet, so this one is being closed automatically — but it won't vanish into the void: a maintainer will still see it, and if the idea's a fit we may reopen it or pick it up. Fastest path to contributing: open an issue describing the change first. See CONTRIBUTING.md.",
            });
            // Tag the auto-closed pile so maintainers can review it later:
            // is:pr is:closed label:auto-closed
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: number,
              labels: ["auto-closed"],
            });
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: number,
              state: "closed",
            });
